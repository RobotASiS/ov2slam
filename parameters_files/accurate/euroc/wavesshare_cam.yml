%YAML 1.0
---

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------

Camera.topic_left: /left/image_raw
Camera.topic_right: /right/image_raw

Camera.model_left: pinhole
Camera.model_right: pinhole

Camera.left_nwidth: 1280
Camera.left_nheight: 720

Camera.right_nwidth: 1280
Camera.right_nheight: 720

# Camera calibration and distortion parameters (OpenCV) 
Camera.fxl: 995.290242462463
Camera.fyl: 997.5041891334962
Camera.cxl: 676.6862918870489
Camera.cyl: 313.3900187607783

Camera.k1l: 0.21259900907962018
Camera.k2l: -0.19927008295345786
Camera.p1l: -0.022789929435139168
Camera.p2l: 0.02851095000625774

Camera.fxr: 988.1460193418324
Camera.fyr: 989.0544072202167
Camera.cxr: 719.3857146078245
Camera.cyr: 315.17104222601967

Camera.k1r: 0.23014455350954474
Camera.k2r: -0.2599952540394232
Camera.p1r: -0.02326235973411566
Camera.p2r: 0.025154070571553902

# Camera Extrinsic parameters T_b_ci ( v_b = T_b_ci * v_ci )
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: data: [1., 0., 0., X_PRZESUNIECIE,
0., 1., 0., 0.027175,
0., 0., 1., Z_PRZESUNIECIE,
0., 0., 0., 1.]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [1., 0., 0., X_PRZESUNIECIE,
0., 1., 0., -0.027175,
0., 0., 1., Z_PRZESUNIECIE,
0., 0., 0., 1.]

#--------------------------------------------------------------------------------------------
# SLAM Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
debug: 0
log_timings: 0

mono: 0
stereo: 1

force_realtime: 1

# Estimator Mode
slam_mode: 1

# Loop Closing mode
buse_loop_closer: 1

# Stereo rectify or not
bdo_stereo_rect: 1
alpha: 0.

# Undist Image or not
bdo_undist: 1

# Init / KF px th.
finit_parallax: 20.

# Features Extractor
use_shi_tomasi: 0
use_fast: 0
use_brief: 1
use_singlescale_detector: 1

# Min dist between kps (define the number of kps)
nmaxdist: 35

# Features quality th.
nfast_th: 10
dmaxquality: 0.001 # used for gftt or singlescale

# Pre-processing
use_clahe: 1
fclahe_val: 3

# KLT related settings.
do_klt: 1
klt_use_prior: 1
btrack_keyframetoframe: 0
nklt_win_size: 9
nklt_pyr_lvl: 3

# Opencv Default: 30 iters. + 0.01 prec.
nmax_iter: 30
fmax_px_precision: 0.01

fmax_fbklt_dist: 0.5
nklt_err: 30.

# Matching th.
bdo_track_localmap: 1

fmax_desc_dist: 0.2 #0.35 # Ratio from desc size (for binary desc.) 
fmax_proj_pxdist: 2.

# Randomize RANSAC?
doepipolar: 1
dop3p : 0
bdo_random: 1
nransac_iter: 100
fransac_err: 3.

# Reproj err th.
fmax_reproj_err: 3.
buse_inv_depth: 1

# Ceres related parameters
robust_mono_th: 5.9915 # (20% : 3.2189 / 10% :  4.6052 / 5% : 5.9915 / 2%: 7.8240 / 1%: 9.2103)  

use_sparse_schur: 1
use_dogleg: 0
use_subspace_dogleg: 0
use_nonmonotic_step: 0

# Estimator parameters
apply_l2_after_robust: 1

nmin_covscore: 25 # Min co-obs for optimizing in SLAM mode BA

# Map Filtering
fkf_filtering_ratio: 0.95

# Final Pass
do_full_ba: 0

Wartości do uzupełnienia:
*   **`X_PRZESUNIECIE`**: Odległość w metrach od samego środka robota do płaszczyzny soczewek kamery (w przód).
*   **`Z_PRZESUNIECIE`**: Wysokość montażu kamery nad ziemią (lub środkiem robota) w metrach.
